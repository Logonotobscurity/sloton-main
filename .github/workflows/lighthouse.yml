name: Lighthouse Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run performance checks weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/insights
            http://localhost:3000/ai-solutions
            http://localhost:3000/automation
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse scores
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
            const scores = results[0].summary;
            
            const comment = `## ⚡ Lighthouse Performance Report
            
            | Category | Score |
            |----------|-------|
            | 🎯 Performance | ${Math.round(scores.performance * 100)} |
            | ♿ Accessibility | ${Math.round(scores.accessibility * 100)} |
            | 🎨 Best Practices | ${Math.round(scores['best-practices'] * 100)} |
            | 🔍 SEO | ${Math.round(scores.seo * 100)} |
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Africa/Lagos'
    open-pull-requests-limit: 10
    reviewers:
      - 'logon_thepage'
    assignees:
      - 'logon_thepage'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    versioning-strategy: increase
    groups:
      # Group all Next.js related updates
      next:
        patterns:
          - 'next'
          - 'next-*'
      # Group all React related updates
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react'
          - '@types/react-dom'
      # Group all Radix UI updates
      radix:
        patterns:
          - '@radix-ui/*'
      # Group all testing libraries
      testing:
        patterns:
          - '@testing-library/*'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
          - 'playwright'
      # Group all dev dependencies
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Africa/Lagos'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'automated'

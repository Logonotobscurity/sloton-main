<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Circuit paths to form an 'O' -->
    <path d="M50 12 A38 38 0 1 1 12 50" fill="none" stroke="#00D587" stroke-width="10" stroke-linecap="round"/>
    <path d="M50 88 A38 38 0 0 1 12 50" fill="none" stroke="#00D587" stroke-width="10" stroke-linecap="round" stroke-dasharray="8 8"/>
    
    <!-- Central Node / Microchip style -->
    <circle cx="50" cy="50" r="16" fill="none" stroke="#00D587" stroke-width="6"/>
    
    <!-- Circuit lines radiating inward/outward -->
    <line x1="50" y1="12" x2="50" y2="34" stroke="#00D587" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="34" r="5" fill="#00D587"/>

    <line x1="88" y1="50" x2="66" y2="50" stroke="#00D587" stroke-width="6" stroke-linecap="round"/>
    <circle cx="66" cy="50" r="5" fill="#00D587"/>

    <line x1="12" y1="50" x2="34" y2="50" stroke="#00D587" stroke-width="6" stroke-linecap="round"/>
    <circle cx="34" cy="50" r="5" fill="#00D587"/>
    
    <!-- Outer Node dots representing connection pins -->
    <circle cx="50" cy="12" r="7" fill="#00D587"/>
    <circle cx="88" cy="50" r="7" fill="#00D587"/>
    <circle cx="12" cy="50" r="7" fill="#00D587"/>
    
    <!-- Angled traces -->
    <path d="M 76.8 23.2 L 61 39" stroke="#00D587" stroke-width="6" stroke-linecap="round"/>
    <circle cx="76.8" cy="23.2" r="6" fill="#00D587"/>
    <circle cx="61" cy="39" r="4" fill="#00D587"/>
  </g>
</svg>
